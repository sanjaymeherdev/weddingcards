<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rashi & Manish</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6dc;--card:#fffaf0;--field:#fffdf6;--ink:#3b0b1c;--soft:#8a3d3a;--rust:#c1121f;--gold:#f2a900;--sage:#d81b60;--line:#f3c640;--foot:#4a0820;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d100a;--card:#2c1a10;--field:#1d100a;--ink:#f3e6d3;--soft:#cdb08f;--line:#5a3d27;--foot:#120a06}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:16px;line-height:1.6;text-align:center;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400}
.label{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--sage)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
section{padding:52px 0}
h2{font-size:clamp(34px,9vw,44px);margin:6px 0 26px;line-height:1.1;font-weight:400}
.divider{display:flex;align-items:center;gap:14px;max-width:560px;margin:0 auto;padding:0 20px;color:var(--rust);font-size:22px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#pg{z-index:20}#gp{z-index:61}#trail{z-index:80}
.petal{position:absolute;top:-30px;border-radius:50%;animation:fall linear infinite;will-change:transform}
.mari{background:radial-gradient(circle,#e8721c 0 22%,#f6b21e 24% 60%,#fbd25a 62%);box-shadow:0 1px 3px rgba(120,60,0,.25)}
.jas{background:radial-gradient(ellipse,#fff 40%,#f1e6d8);border-radius:50% 0 50% 50%;opacity:.9}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) rotate(0)}25%{transform:translate3d(var(--sw),28vh,0) rotate(120deg)}50%{transform:translate3d(calc(var(--sw)*-.6),58vh,0) rotate(240deg)}75%{transform:translate3d(var(--sw),88vh,0) rotate(330deg)}100%{transform:translate3d(0,112vh,0) rotate(420deg)}}
.tf{position:absolute;background:center/contain no-repeat;transform:translate(-50%,-50%) scale(0);opacity:0;animation:bloom 1.25s ease-out forwards;filter:drop-shadow(0 1px 2px rgba(80,40,0,.3))}
@keyframes bloom{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:1}18%{transform:translate(-50%,-50%) scale(1) rotate(calc(var(--r)*.2));opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5) rotate(var(--r));opacity:0}}
#music{position:fixed;z-index:70;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:48px;height:48px;border-radius:50%;border:2px solid #e0a43a;background:rgba(251,245,236,.92);color:var(--rust);font-size:22px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:0}
:root:not([data-theme="light"]) #music{background:rgba(29,16,10,.85)}
#music.off{opacity:.55}#music.off:after{content:"";position:absolute;width:30px;height:2px;background:var(--rust);transform:rotate(-45deg)}
#music.on{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(224,164,58,.18)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#gate{position:fixed;inset:0;z-index:60;background:#3a0c0c;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:opacity 1.2s ease,transform 1.2s ease}
#gate.open{opacity:0;transform:scale(1.06);pointer-events:none}
#gate .art{flex:1;width:100%;max-width:520px;background:var(--img-gate) center top/cover no-repeat;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
#gate .cta{padding:0 0 calc(54px + env(safe-area-inset-bottom,0px));color:#d8ac6a;font-family:'Cormorant Garamond',serif;letter-spacing:.38em;text-transform:uppercase;font-size:clamp(14px,4vw,18px);background:none;border:0;cursor:pointer}
#gate .cta:after{content:"";display:block;margin:12px auto 0;width:120px;height:1px;background:#d8ac6a}
#gate .cta span{display:block;animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:90px 20px 60px;background:var(--img-hero) center 30%/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,10,5,.55),rgba(20,10,5,.35) 45%,rgba(20,10,5,.7))}
.hero>*{position:relative}
.hero .tw{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:600}
.hero .n1{font-family:'Cormorant Garamond',serif;font-size:clamp(60px,18vw,92px);line-height:1;margin:.15em 0 0;font-weight:400}
.hero .amp{color:var(--gold);font-size:26px}
.hero .n2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(64px,19vw,100px);line-height:1;color:#e8b04a;margin:0 0 .15em}
.hero .inv{font-family:'Cormorant Garamond',serif;letter-spacing:.12em;font-size:20px}
.hero .dates{font-weight:600;letter-spacing:.06em;margin:.6em 0 .2em;font-size:clamp(15px,4.3vw,18px)}
.hero .dates i{color:#e8b04a;font-style:normal;margin:0 8px}
.hero .ven{color:#e9d3b6;font-size:15px}
.count{display:flex;gap:clamp(14px,5vw,30px);margin:34px 0 28px}
.count b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(36px,10vw,46px);color:#e8b04a;line-height:1}
.count span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f1e3cf}
.scroll{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#f1e3cf;text-decoration:none}
.arch{width:min(86%,400px);aspect-ratio:3/4;object-fit:cover;border:3px solid var(--gold);border-radius:110px 110px 56px 56px;box-shadow:0 18px 40px rgba(60,30,10,.25);margin:26px auto 30px;display:block}
.q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,5.4vw,24px);line-height:1.45;text-align:left;max-width:440px;margin:0 auto}
.by{text-align:left;max-width:440px;margin:10px auto 0;color:var(--soft)}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px 26px;margin:0 0 20px;text-align:left;overflow:hidden}
.ev:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--a1,#b5603a),var(--a2,var(--gold)))}
.dayhead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,6vw,26px);color:var(--rust);margin:34px 0 16px;display:flex;align-items:center;gap:12px}
.dayhead:first-of-type{margin-top:0}
.dayhead:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.theme{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:30px;padding:6px 14px 6px 10px}
.theme i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block}
.theme i+i{margin-left:-14px}
.fam{display:grid;gap:18px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
.fc .t{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage)}
.fc h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:38px;margin:6px 0 2px;color:var(--rust)}
.fc .r{color:var(--soft);margin:0 0 8px}
.fc p.pn{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,5.4vw,23px);margin:0;line-height:1.5}
.ev .ic{font-size:36px;line-height:1}
.ev h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:32px;margin:12px 0 2px}
.ev .d{color:var(--rust);font-size:15px;margin:0}.ev .tm{color:var(--soft);font-size:15px;margin:0 0 12px}.ev p.x{margin:0}
.full{position:relative;height:min(80vh,560px);background:var(--img-banner) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center}
.full:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(20,10,5,.7))}
.full p{position:relative;z-index:1;color:#fff;font-size:clamp(22px,6vw,28px);margin:0 0 22px;padding:0 16px}
.vimg{width:100%;border-radius:4px;box-shadow:0 14px 34px rgba(60,30,10,.25);display:block}
.vname{font-size:clamp(30px,8vw,38px);margin:26px 0 6px;font-weight:400}
.addr{color:var(--soft);line-height:2;margin:0 0 24px}
.mapbox{position:relative;display:block;width:100%;height:250px;margin:28px 0 0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 10px 28px rgba(60,30,10,.18);text-align:left;text-decoration:none}
.mapbox iframe{width:100%;height:100%;border:0;pointer-events:none}
.maphint{position:absolute;right:12px;bottom:12px;left:12px;display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;border:1px solid rgba(255,255,255,.45);border-radius:12px;background:rgba(251,245,236,.95);color:var(--rust);box-shadow:0 3px 12px rgba(0,0,0,.16);font-size:14px;font-weight:600}
.map-pin{font-size:22px}.maphint small{display:block;color:var(--soft);font-size:11px;font-weight:400;letter-spacing:.04em}.map-arrow{margin-left:auto;font-size:20px}
:root:not([data-theme="light"]) .maphint{background:rgba(44,26,16,.96)}
.mapfallback{display:grid;height:100%;place-items:center;background:repeating-linear-gradient(35deg,var(--card) 0 28px,var(--bg) 28px 54px);color:var(--soft);font-size:14px}
.pill{display:inline-flex;gap:10px;align-items:center;border:1.5px solid var(--rust);color:var(--rust);border-radius:40px;padding:14px 28px;text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.form{background:var(--card);border:1px solid var(--line);border-radius:44px 44px 28px 28px;padding:30px 24px;text-align:left}
.form .intro{text-align:center;color:var(--soft);margin-top:0}.form .intro b{color:var(--rust)}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:18px 0 8px}
input,select,textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;font:16px 'Jost',sans-serif}
textarea{resize:vertical;min-height:90px}
.go{width:100%;margin-top:26px;background:var(--rust);color:#fff;border:0;border-radius:40px;padding:18px;font:600 15px 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.go:disabled{opacity:.6}
#err{color:#b3261e;text-align:center;margin:14px 0 0;min-height:1em}
#thanks{display:none;font-size:30px;padding:36px 0;color:var(--rust);text-align:center}
footer{background:var(--foot);color:#e8d3b0;padding:44px 16px calc(50px + env(safe-area-inset-bottom,0px))}
footer .box{max-width:560px;margin:0 auto;border:1px solid rgba(201,161,91,.3);border-radius:22px;padding:34px 18px}
footer .nm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(38px,11vw,52px);color:#e0aa55;margin:0;line-height:1.1}
footer .bl{display:flex;align-items:center;gap:14px;font-family:'Cormorant Garamond',serif;font-size:clamp(22px,6vw,28px);margin:22px 0}
footer .bl:before,footer .bl:after{content:"";flex:1;height:1px;background:rgba(201,161,91,.4)}
.cols{display:grid;grid-template-columns:1fr 1fr;font-family:'Cormorant Garamond',serif;font-size:clamp(16px,4.2vw,19px);line-height:1.4}
.cols div{padding:0 12px}.cols div+div{border-left:1px solid rgba(201,161,91,.4)}.cols p{margin:0 0 16px}
@media(max-width:380px){.cols{grid-template-columns:1fr}.cols div+div{border:0}}
#fatal{padding:80px 24px;font-family:system-ui;color:#7a1f1f}
@media (prefers-reduced-motion:reduce){.petals{display:none}#gate{transition:none}#gate .cta span,#music.on{animation:none}html{scroll-behavior:auto}}

/* ===== vibrant + animated layer ===== */
@keyframes flow{to{background-position:200% 0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg) scale(1.12)}}
@keyframes drift{50%{background-position:100% 100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.6)}}
@keyframes glowtxt{50%{text-shadow:0 0 16px #ffc400,0 0 34px #ff2e93}}
@keyframes tk{30%{transform:scale(1.3);color:#fff}}
@keyframes halo{50%{box-shadow:0 0 0 12px rgba(242,169,0,.28),0 18px 44px rgba(193,18,31,.35)}}
@keyframes sweep{0%,55%{left:-80%}100%{left:140%}}
@keyframes hue{33%{color:var(--gold)}66%{color:var(--sage)}}
@keyframes throb{50%{transform:scale(1.03)}}
@keyframes kb{from{background-position:20% 20%}to{background-position:80% 45%}}
@keyframes zoom{to{transform:scale(1.08)}}
@keyframes cfall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
body{background:linear-gradient(#fff6dc,#ffe9a8 45%,#fff6dc)}
#prog{position:fixed;top:0;left:0;height:4px;width:100%;z-index:90;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#f2a900,#ff2e93,#7b2ff7,#f2a900);background-size:200% 100%;animation:flow 4s linear infinite}
#cfl{z-index:85}
.cf{position:absolute;top:-20px;opacity:0;border-radius:2px;animation:cfall 2.8s ease-in forwards}
#gate{background:radial-gradient(circle at 50% 30%,#8a0f35,#2a0410)}
#gate .art{animation:zoom 16s ease-in-out infinite alternate}
#gate .cta{color:#ffc400}
.hero{animation:kb 24s ease-in-out infinite alternate}
.hero:before{background:linear-gradient(rgba(70,5,30,.5),rgba(70,5,30,.18) 45%,rgba(60,5,25,.78))}
.hero>*{opacity:0}
body.in .hero>*{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
body.in .hero>*:nth-child(2){animation-delay:.2s}body.in .hero>*:nth-child(3){animation-delay:.4s}body.in .hero>*:nth-child(4){animation-delay:.6s}body.in .hero>*:nth-child(5){animation-delay:.8s}body.in .hero>*:nth-child(6){animation-delay:1s}
.hero .n1,.hero .n2,footer .nm{background:linear-gradient(100deg,#fff,#ffd54a,#fff,#ffb300,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero .n2{background-image:linear-gradient(100deg,#ffb300,#fff2a8,#ffb300,#ff6f91,#ffb300)}
body.in .hero .n1,body.in .hero .n2{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both,flow 5s linear infinite}
footer .nm{animation:flow 5s linear infinite}
.hero .amp{color:#ffc400;display:inline-block}
body.in .hero .amp{animation:rise 1s .5s both,bob 2.4s 1.5s ease-in-out infinite}
.hero>.spark{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(#fff 0 25%,rgba(255,200,60,.9) 42%,transparent 70%);pointer-events:none}
body.in .hero>.spark{animation:tw var(--t) ease-in-out infinite}
.count b{animation:glowtxt 2.4s ease-in-out infinite}
.count b.tk{animation:tk .6s,glowtxt 2.4s ease-in-out infinite}
.divider{animation:hue 3.5s linear infinite}
#story{background:radial-gradient(circle at 50% 0,#ffe27a,transparent 62%)}
.arch{border:4px solid var(--gold);animation:halo 3s ease-in-out infinite}
.q{color:var(--rust)}
.sfam{background:linear-gradient(180deg,transparent,#ffd1e4 50%,transparent)}
.fc{background:linear-gradient(145deg,#fff,#ffe9a0);border:2px solid var(--gold);box-shadow:0 10px 26px rgba(193,18,31,.16);transition:box-shadow .3s}
.fc:hover{box-shadow:0 16px 40px rgba(242,169,0,.5)}
.evhead{padding-bottom:0}
.day{position:relative;overflow:hidden;padding:46px 0 34px}
.day>.wrap{position:relative;z-index:1}
.day:before{content:"";position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(242,169,0,.2) 0 6deg,transparent 6deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%);animation:spin 70s linear infinite}
.d0{background:linear-gradient(135deg,#fff1b8,#ffd3a1,#ffc2d9,#fff1b8);background-size:300% 300%;animation:drift 14s ease infinite}
.d1{--ink:#fff3d6;--soft:#ffd9a0;--rust:#ffc400;--sage:#ff8fc2;--line:rgba(255,196,0,.5);color:var(--ink);background:linear-gradient(135deg,#3a0a5c,#8e0f4f,#c2410c,#3a0a5c);background-size:300% 300%;animation:drift 14s ease infinite}
.d1 .ev{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
.dayhead{font-size:clamp(24px,6.6vw,30px)}
.ev{background:linear-gradient(145deg,#fff,#fff0bf);border:2px solid var(--a1,var(--line));box-shadow:0 12px 30px rgba(193,18,31,.16);transition:box-shadow .3s}
.ev:hover{box-shadow:0 18px 46px rgba(242,169,0,.5)}
.ev:before{height:7px;background:linear-gradient(90deg,var(--a1,#c1121f),var(--a2,var(--gold)),var(--a1,#c1121f));background-size:200% 100%;animation:flow 3s linear infinite}
.ev:after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none;animation:sweep 5.5s ease-in-out infinite}
.ev .ic{display:inline-block;animation:bob 3s ease-in-out infinite}
.ev .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;margin:0 0 6px;color:var(--sage)}
.svn{background:radial-gradient(circle at 80% 15%,#ffe27a,transparent 55%)}
.map-pin{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.srsvp{background:linear-gradient(180deg,transparent,#ffe0a3 40%,#ffc2d9)}
.form{border:2px solid var(--gold);box-shadow:0 14px 36px rgba(193,18,31,.2)}
.go{background:linear-gradient(90deg,#c1121f,#ff2e93,#f2a900,#c1121f);background-size:200% 100%;box-shadow:0 8px 22px rgba(193,18,31,.4)}
.go:not(:disabled){animation:flow 4s linear infinite,throb 2s ease-in-out infinite}
footer{background:linear-gradient(135deg,#4a0820,#7a0f3a 50%,#4a0820)}
footer .rg{margin:18px 0 0;font-family:'Cormorant Garamond',serif;font-size:20px;color:#ffd35a;white-space:pre-line}
.rv{opacity:0;transform:translateY(40px) scale(.96);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--dl,0s)}
.rv.l{transform:translateX(-60px) rotate(-2deg)}.rv.r{transform:translateX(60px) rotate(2deg)}.rv.z{transform:scale(.7) rotate(-6deg)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv,.hero>*{opacity:1!important;transform:none!important}.spark,.cf{display:none}}
</style>
</head>
<body class="locked">
<div id="gate" role="button" tabindex="0" aria-label="Open the invitation"><div class="art"></div><button class="cta" type="button"><span id="prompt">Open the invitation</span></button></div>
<div class="petals" id="gp"></div>
<div class="petals" id="pg"></div>
<div class="petals" id="trail"></div><div class="petals" id="cfl"></div><div id="prog"></div>

<form name="rsvp" data-netlify="true" hidden><input name="name"><input name="phone"><input name="from"><input name="events"><input name="guests"><textarea name="message"></textarea></form>

<script>
(function(){
var $=function(s,r){return(r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* config.json is the source of truth; an inline copy (#inline-config) is only a fallback for single-file previews */
async function loadConfig(){
 if(/[?&]preview=1/.test(location.search)){try{var pv=localStorage.getItem('wc_preview');if(pv)return JSON.parse(pv)}catch(e){}}
 try{var r=await fetch('config.json',{cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}
 var el=document.getElementById('inline-config');if(el)return JSON.parse(el.textContent);
 throw new Error('config.json not found. Open this page through a web server (or Netlify), not file://');
}

function confetti(n){if(reduce)return;var L=$('#cfl'),cs=['#f2a900','#ff2e93','#c1121f','#7b2ff7','#ffd000','#ff7a00'];

 $('#app').innerHTML=
 '<header class="hero"><div class="tw">'+esc(H.tagline)+'</div><h1 class="n1">'+esc(H.name1)+'</h1><div class="amp serif">&amp;</div><div class="n2">'+esc(H.name2)+'</div>'+
 '<div class="inv">'+esc(H.invite)+'</div><div class="dates">'+H.dates.map(esc).join(' <i>✦</i> ')+'</div>'+(H.venue?'<div class="ven">'+esc(H.venue)+'</div>':'')+

 '<div class="divider">❧</div>'+
 '<section class="sfam"><div class="wrap"><div class="label">'+esc(FM.label)+'</div><h2 class="serif">'+esc(FM.heading)+'</h2><div class="fam">'+[FM.bride,FM.groom].map(function(f){return'<div class="fc"><div class="t">'+esc(f.title)+'</div><h3>'+esc(f.name)+'</h3><p class="r">'+esc(f.relation)+'</p>'+f.parents.map(function(p){return'<p class="pn">'+esc(p)+'</p>'}).join('')+'</div>'}).join('')+'</div></div></section><div class="divider">❧</div>'+
  '<section class="evhead"><div class="wrap"><div class="label">'+esc(E.label)+'</div><h2 class="serif">'+esc(E.heading)+'</h2></div></section>'+
 E.days.map(function(d,i){return'<div class="day d'+(i%2)+'"><div class="wrap"><div class="dayhead">'+esc(d.date)+'</div>'+d.items.map(function(e){var c=e.colors||[];
   var sw=e.theme?'<div class="theme">'+c.map(function(x){return'<i style="background:'+esc(x)+'"></i>'}).join('')+'Theme · '+esc(e.theme)+'</div>':'';
   return'<div class="ev"'+(c.length?' style="--a1:'+esc(c[0])+';--a2:'+esc(c[1]||c[0])+'"':'')+'><div class="ic">'+esc(e.icon)+'</div><h3>'+esc(e.title)+'</h3>'+(e.sub?'<p class="sub">'+esc(e.sub)+'</p>':'')+'<p class="tm" style="color:var(--rust);font-weight:500">'+esc(e.time)+'</p>'+sw+'<p class="x">'+esc(e.text)+'</p></div>'}).join('')+'</div></div>'}).join('')+
 '<div class="full" role="img" aria-label="'+esc(V.name)+'"><p class="serif">'+esc(C.banner.quote)+'</p></div><div class="divider" style="margin-top:36px">❧</div>'+
 '<section class="svn"><div class="wrap"><div class="label" style="color:#a8873c">'+esc(V.label)+'</div><h2 class="serif">'+esc(V.heading)+'</h2><img class="vimg" src="'+esc(V.image)+'" alt="'+esc(V.name)+'">'+
 '<h3 class="serif vname">'+esc(V.name)+'</h3>'+(V.address&&V.address.length?'<p class="addr">'+V.address.map(esc).join('<br>')+'</p>':'')+(V.mapsUrl?'<a class="mapbox" target="_blank" rel="noopener" href="'+esc(V.mapsUrl)+'" aria-label="Open '+esc(V.name)+' in Google Maps">'+(V.mapsEmbedUrl?'<iframe src="'+esc(V.mapsEmbedUrl)+'" title="Map showing '+esc(V.name)+'" aria-hidden="true" tabindex="-1" loading="lazy"></iframe>':'<span class="mapfallback">Map preview unavailable</span>')+'<span class="maphint"><span class="map-pin" aria-hidden="true">📍</span><span>'+esc(V.mapsText)+'<small>Tap to open this exact location in Google Maps</small></span><span class="map-arrow" aria-hidden="true">↗</span></span></a>':'')+'</div></section><div class="divider">❧</div>'+
 '<section class="srsvp"><div class="wrap"><div class="label">'+esc(R.label)+'</div><h2 class="serif">'+esc(R.heading)+'</h2><div class="form">'+
 '<p class="intro">'+esc(R.intro).replace('{deadline}','<b>'+esc(R.deadline)+'</b>')+'</p>'+
 '<form id="rsvp"><label for="n">Your name</label><input id="n" name="name" placeholder="Full name" required autocomplete="name">'+
 '<label for="p">WhatsApp / Phone</label><input id="p" name="phone" type="tel" placeholder="+91 00000 00000" required autocomplete="tel">'+
 '<label for="f">You’re joining from</label><select id="f" name="from" required><option value="">Select one</option>'+opts(R.from)+'</select>'+
 '<label for="e">Attending which events?</label><select id="e" name="events">'+opts(R.events)+'</select>'+
 '<label for="g">Guests</label><select id="g" name="guests">'+opts(R.guests)+'</select>'+
 '<label for="msg">Message (optional)</label><textarea id="msg" name="message" placeholder="Wishes, blessings, song requests..."></textarea>'+
 '<button class="go" type="submit">'+esc(R.button)+'</button><p id="err" role="alert"></p></form>'+
 '<div id="thanks" class="serif" role="status">'+esc(R.thanks)+'<br><small style="font-size:22px;color:var(--soft)">'+esc(R.thanksBy)+'</small></div></div></div></section><div class="divider">❧</div>'+
 '<footer><div class="box"><p class="nm">'+esc(F.names)+'</p><div class="bl">'+esc(F.blessing)+'</div><div class="cols"><div>'+col(F.left)+'</div><div>'+col(F.right)+'</div></div>'+(F.regards?'<p class="rg">'+esc(F.regards)+'</p>':'')+'</div></footer>';

 $('.scroll').onclick=function(e){e.preventDefault();$('#story').scrollIntoView({behavior:reduce?'auto':'smooth'})};

 /* sparkles, scroll progress, scroll reveals */
 for(var k=0;k<28;k++){var sp=document.createElement('i');sp.className='spark';sp.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--s:'+(6+Math.random()*12)+'px;--t:'+(2+Math.random()*3)+'s;animation-delay:-'+Math.random()*4+'s';$('.hero').appendChild(sp)}
 var pr=$('#prog');addEventListener('scroll',function(){var de=document.documentElement;pr.style.transform='scaleX('+Math.min(1,de.scrollTop/Math.max(1,de.scrollHeight-de.clientHeight))+')'},{passive:true});
 if(!reduce&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
  [['#story .wrap>*'],['.fc','a'],['.evhead .wrap>*'],['.dayhead'],['.ev','a'],['.vimg'],['.vname'],['.addr'],['.mapbox'],['.srsvp .wrap>*'],['footer .box'],['.arch','z']].forEach(function(p){
   document.querySelectorAll(p[0]).forEach(function(el,i){el.classList.add('rv');if(p[1]==='z')el.classList.add('z');else if(p[1]==='a')el.classList.add(i%2?'r':'l');el.style.setProperty('--dl',(i%3)*.12+'s');io.observe(el)})})}

 /* countdown */
 var target=new Date(H.countdownTo).getTime(),pad=function(x){return x<10?'0'+x:''+x};
 function tick(){var t=Math.max(0,target-Date.now());
  $('#d').textContent=Math.floor(t/864e5);$('#h').textContent=pad(Math.floor(t%864e5/36e5));$('#m').textContent=pad(Math.floor(t%36e5/6e4));$('#s').textContent=pad(Math.floor(t%6e4/1e3));var se=$('#s');se.classList.remove('tk');void se.offsetWidth;se.classList.add('tk')}
 tick();setInterval(tick,1000);

 /* RSVP */
 var form=$('#rsvp');
 form.onsubmit=async function(e){e.preventDefault();
  var data={};new FormData(form).forEach(function(v,k){data[k]=v});
  var btn=$('.go');btn.disabled=true;$('#err').textContent='';var ok=true;
  try{
   if(R.mode==='netlify'){var r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({'form-name':'rsvp'},data)).toString()});ok=r.ok}
   else if(R.mode==='endpoint'){var r2=await fetch(R.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});ok=r2.ok}
   else if(R.mode==='whatsapp'){var txt='RSVP for '+H.name1+' & '+H.name2+'’s wedding 🎉 — '+data.name+' ('+data.phone+'), from '+data.from+', '+data.events+', guests: '+data.guests+(data.message?'. '+data.message:'');
    window.open('https://wa.me/'+String(R.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(txt),'_blank')}
  }catch(err){ok=false}
  if(ok){confetti(100);form.style.display='none';$('.intro').style.display='none';$('#thanks').style.display='block'}
  else{$('#err').textContent=R.error;btn.disabled=false}
 };
}

function setup(C){
 render(C);
 var fx=C.effects||{},P=fx.petals||{};
 function rain(id,cls,n,min,max){var c=document.getElementById(id);for(var i=0;i<n;i++){var p=document.createElement('i'),s=min+Math.random()*(max-min);
  p.className='petal '+cls;p.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+Math.random()*18+'s;--sw:'+(Math.random()*90-45)+'px';c.appendChild(p)}}
 rain('pg','mari',P.marigold||0,8,17);rain('gp','jas',P.jasmine||0,10,18);

 /* flower trail: mouse move + finger drag */
 var T=fx.trail||{};
 if(T.enabled&&!reduce){
  var layer=$('#trail'),colors=T.colors&&T.colors.length?T.colors:['#f6b21e'],size=T.size||26,gap=T.spacing||30,cache={},lx=-999,ly=-999;
  var flower=function(c){return cache[c]||(cache[c]='url("data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'><g fill='"+c+"' stroke='rgba(0,0,0,.12)' stroke-width='1.5'>"+[0,60,120,180,240,300].map(function(a){return"<ellipse cx='0' cy='-27' rx='13' ry='22' transform='rotate("+a+")'/>"}).join('')+"</g><circle r='10' fill='#8a3b12'/></svg>")+'")')};
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  function bloom(x,y){
   if(Math.hypot(x-lx,y-ly)<gap)return;lx=x;ly=y;
   if(layer.childElementCount>70)return;
   var e=document.createElement('i'),sz=size*rnd(.6,1.3);
   e.className='tf';e.style.cssText='left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;background-image:'+flower(colors[Math.floor(Math.random()*colors.length)])+';--dx:'+rnd(-30,30)+'px;--dy:'+rnd(30,80)+'px;--r:'+rnd(-220,220)+'deg';
   layer.appendChild(e);setTimeout(function(){e.remove()},1300)}
  addEventListener('pointermove',function(e){if(e.pointerType==='mouse')bloom(e.clientX,e.clientY)},{passive:true});
  var touch=function(e){for(var i=0;i<e.touches.length;i++)bloom(e.touches[i].clientX,e.touches[i].clientY)};
  addEventListener('touchstart',function(e){lx=-999;touch(e)},{passive:true});
  addEventListener('touchmove',touch,{passive:true});
 }

 /* music: config.music.src (mp3) if given, otherwise a soft synthesized loop */
 var M=C.music||{},vol=M.volume==null?.6:M.volume,btn=$('#music'),playing=false,ac,master,timer,audio;
 var scale=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
 function note(f,t,dur,v){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)}
 function synth(){
  if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=0;
   var dl=ac.createDelay(1);dl.delayTime.value=.42;var fb=ac.createGain();fb.gain.value=.38;dl.connect(fb);fb.connect(dl);master.connect(dl);dl.connect(ac.destination);master.connect(ac.destination);
   [130.81,196,261.62].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=[.07,.05,.025][i];o.connect(g);g.connect(master);o.start()})}
  ac.resume();master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(vol,ac.currentTime+2.5);
  var step=0,idx=2;(function sched(){var t=ac.currentTime+.05,r=Math.random();idx=Math.max(0,Math.min(scale.length-1,idx+(r<.4?1:r<.8?-1:r<.9?2:-2)));
   note(scale[idx],t,2.2,.16);if(step%4===0)note(scale[0]/2,t,3,.12);step++;timer=setTimeout(sched,step%3?520:900)})()}
 function start(){if(M.src){audio=audio||Object.assign(new Audio(M.src),{loop:true,volume:vol});audio.play().catch(function(){})}else synth();playing=true;btn.className='on'}
 function stop(){if(M.src){audio&&audio.pause()}else{clearTimeout(timer);if(ac){master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(0,ac.currentTime+.8)}}playing=false;btn.className='off'}
 btn.onclick=function(){playing?stop():start()};

 var gate=$('#gate');
 function open(){gate.classList.add('open');document.body.classList.add('in');confetti(80);document.body.classList.remove('locked');var g=$('#gp');g.style.transition='opacity 1.2s';g.style.opacity=0;start();setTimeout(function(){gate.style.display='none'},1300)}
 gate.addEventListener('click',open);
 gate.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
 gate.focus();
}

loadConfig().then(setup).catch(function(err){document.body.classList.remove('locked');$('#gate').style.display='none';document.body.insertAdjacentHTML('afterbegin','<p id="fatal">'+esc(err.message)+'</p>')});
})();
</script>
